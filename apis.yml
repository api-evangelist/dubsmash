name: Dubsmash
description: >-
  Dubsmash was a video-selfie and lip-sync mobile application that let users record short videos
  set to a library of popular audio clips, quotes, and songs. Founded in Germany in 2014 by Jonas
  Druppel, Roland Grenke, and Daniel Taschik, it grew into one of the most downloaded social video
  apps, particularly among younger creators in the United States. Reddit acquired Dubsmash in
  December 2020, integrated its video-creation technology into the Reddit platform, and discontinued
  the standalone Dubsmash app on February 22, 2022. Dubsmash never offered a public developer API,
  SDK, or documentation program; its consumer domain (dubsmash.com) no longer resolves. This profile
  is retained in the API Evangelist network as a historical, defunct company record surfaced from
  venture-capital portfolio data.
